name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      # Store upload runs only once these secrets exist; the first submission is manual.
      CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
      EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_OUTPUT
            echo "TAG=v${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
            echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Check version format
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]] || { echo "Chrome Web Store versions are 1 to 4 dot-separated integers, got: $VERSION"; exit 1; }

      - name: Create tag (if manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag "v${{ inputs.version }}" || true
          git push origin "v${{ inputs.version }}" || true

      - name: Install dependencies
        run: cd extension && pnpm install --frozen-lockfile

      - name: Write version into manifest
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cd extension
          jq --arg v "$VERSION" '.version = $v' manifest.json > manifest.tmp && mv manifest.tmp manifest.json

      - name: Build extension
        run: cd extension && pnpm build

      - name: Check package contents
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cd extension/dist
          test "$(ls themes)" = "city-nyc" || { echo "Unexpected themes:"; ls themes; exit 1; }
          test -f THIRD_PARTY_NOTICES.md
          test "$(find . -name manifest.json | wc -l)" -eq 1 || { echo "The store accepts exactly one manifest.json"; find . -name manifest.json; exit 1; }
          jq -e --arg v "$VERSION" '.version == $v' manifest.json

      - name: Package as ZIP
        run: |
          cd extension/dist
          zip -r ${{ runner.temp }}/contribution-lands-${{ steps.version.outputs.VERSION }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: Contribution Lands v${{ steps.version.outputs.VERSION }}
          body: |
            ## Contribution Lands v${{ steps.version.outputs.VERSION }}

            Turns the contribution graph on GitHub profile pages into an isometric New York skyline.

            ### Install
            Add it from the [Chrome Web Store](https://chromewebstore.google.com/detail/contribution-lands/bbapichgjbdkehhdgaonahkjicihdhih), then visit any GitHub profile.

            To load this build by hand instead, unzip `contribution-lands-${{ steps.version.outputs.VERSION }}.zip`, open `chrome://extensions`, turn on **Developer mode**, click **Load unpacked** and select the folder.

            Requires Chrome 111 or later.
          files: |
            ${{ runner.temp }}/contribution-lands-${{ steps.version.outputs.VERSION }}.zip
          draft: false
          prerelease: false

      - name: Upload and publish to the Chrome Web Store
        if: env.EXTENSION_ID != ''
        run: npx --yes chrome-webstore-upload-cli@4.0.2 --source "${{ runner.temp }}/contribution-lands-${{ steps.version.outputs.VERSION }}.zip"
